<!-- Bạn hãy thay thế đoạn script cũ bằng đoạn dưới đây để cập nhật tính năng -->
<script>
    const SLIDE_DURATION_MS = 7000; 
    const AUTO_LOOP_DELAY_MS = 60000; // Đã cập nhật thành 60 giây

    // ... (Giữ nguyên các phần thiết lập player API cũ)

    function startSlideLoop() {
        slideshowInterval = setInterval(function() {
            if(!isPaused) {
                if(currentIdx < slides.length - 1) {
                    goToSlide(currentIdx + 1);
                } else {
                    // Slide cuối: Giữ nhạc phát liên tục, không gọi fadeOutAllAudio()
                    clearInterval(slideshowInterval);
                    startLoopCountdown();
                }
            }
        }, SLIDE_DURATION_MS);
    }

    function startLoopCountdown() {
        remainingLoopSeconds = AUTO_LOOP_DELAY_MS / 1000;
        if(loopCountdownInterval) clearInterval(loopCountdownInterval);
        
        loopCountdownInterval = setInterval(function() {
            if(!isPaused) {
                remainingLoopSeconds--;
                if(remainingLoopSeconds <= 0) {
                    clearInterval(loopCountdownInterval);
                    restartSlideshowToBeginning();
                }
            }
        }, 1000);
    }

    function restartSlideshowToBeginning() {
        if(loopCountdownInterval) clearInterval(loopCountdownInterval);
        
        slides[currentIdx].classList.remove('active');
        currentIdx = 0;
        slides[currentIdx].classList.add('active');
        
        totalElapsedSeconds = 0;
        updateHUD();
        
        if (apiReady) {
            // Khi khởi động lại, reset các player về đầu và mix lại nhạc
            pOpening.seekTo(0);
            pMiddle.seekTo(0);
            pClose.seekTo(0);
            
            ensureTrackPlaying(pOpening, 100);
            ensureTrackMutedOrPaused(pMiddle);
            ensureTrackMutedOrPaused(pClose);
        }
        
        runTimelineCounter();
        startSlideLoop();
    }
    
    // ... (Các hàm khác giữ nguyên để đảm bảo logic trình chiếu)
</script>
