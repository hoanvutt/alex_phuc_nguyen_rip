<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Kỷ Niệm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Nền đen trang trọng */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Vùng hiển thị Slideshow Full Toàn Màn Hình */
        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Định dạng từng Slide ảnh */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out; /* Hiệu ứng fade mượt mà */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }

        /* Hiển thị ảnh Full Page */
        .slide img {
            width: 100%;
            height: 100%;
            /* 'contain' giúp giữ nguyên vẹn khung hình và chữ của các bức ảnh thông báo. 
               Nếu muốn ảnh tràn viền tuyệt đối bất chấp cắt góc, hãy đổi thành 'cover' */
            object-fit: contain; 
        }

        /* Chữ hiển thị trên Slide - Kích thước lớn, rõ nét */
        .caption {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 2.8rem; /* Cỡ chữ to hơn theo yêu cầu */
            font-weight: 600;
            text-shadow: 2px 2px 15px rgba(0, 0, 0, 0.9), -2px -2px 15px rgba(0, 0, 0, 0.9);
            text-align: center;
            z-index: 10;
            width: 85%;
            pointer-events: none;
            letter-spacing: 1px;
        }

        /* Nút điều khiển ẩn/hiện nếu cần bấm thủ công */
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .controls:hover {
            opacity: 1;
        }
        .controls button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="slideshow-container" id="slideshow">
        <!-- Các slide sẽ tự động được tạo và chèn vào đây bằng JavaScript bên dưới -->
    </div>

    <div class="controls">
        <button onclick="togglePause()" id="btnPause">Tạm dừng</button>
    </div>

    <script>
        // CẤU HÌNH THỜI GIAN CHẠY ẢNH (Tính bằng mili-giây)
        // 2500ms = 2.5 giây per ảnh (Đã tăng tốc độ chạy nhanh hơn theo yêu cầu)
        const DISPLAY_DURATION = 2500; 

        // DANH SÁCH SẮP XẾP TOÀN BỘ 38 HÌNH ẢNH THEO ĐÚNG MẠCH BỐ CỤC YÊU CẦU
        const imageList = [
            { src: "phuc_44.jpg", caption: "" }, // Ảnh mở đầu
            
            // Khối 1: Từ phuc_1 đến phuc_14
            { src: "phuc_1.jpg", caption: "" }, { src: "phuc_2.jpg", caption: "" },
            { src: "phuc_3.jpg", caption: "" }, { src: "phuc_4.jpg", caption: "" },
            { src: "phuc_5.jpg", caption: "" }, { src: "phuc_6.jpg", caption: "" },
            { src: "phuc_7.jpg", caption: "" }, { src: "phuc_8.jpg", caption: "" },
            { src: "phuc_9.jpg", caption: "" }, { src: "phuc_10.jpg", caption: "" },
            { src: "phuc_11.jpg", caption: "" }, { src: "phuc_12.jpg", caption: "" },
            { src: "phuc_13.jpg", caption: "" }, { src: "phuc_14.jpg", caption: "" },
            
            // Khối 2: Từ phuc_15 đến phuc_24
            { src: "phuc_15.jpg", caption: "" }, { src: "phuc_16.jpg", caption: "" },
            { src: "phuc_17.jpg", caption: "" }, { src: "phuc_18.jpg", caption: "" },
            { src: "phuc_19.jpg", caption: "" }, { src: "phuc_20.jpg", caption: "" },
            { src: "phuc_21_2.jpg", caption: "" }, { src: "phuc_22.jpg", caption: "" },
            { src: "phuc_23.jpg", caption: "" }, { src: "phuc_24.jpg", caption: "" },
            
            // Khối 3: Từ phuc_25 đến phuc_37 (có bỏ qua một số số không có trong danh sách gốc của bạn)
            { src: "phuc_25.jpg", caption: "" }, { src: "phuc_26.jpg", caption: "" },
            { src: "phuc_27.jpg", caption: "" }, { src: "phuc_28.jpg", caption: "" },
            { src: "phuc_29.jpg", caption: "" }, { src: "phuc_30.jpg", caption: "" },
            { src: "phuc_34.jpg", caption: "" }, { src: "phuc_35.jpg", caption: "" },
            { src: "phuc_36_2.jpg", caption: "" }, { src: "phuc_37.jpg", caption: "" },
            
            // Khối 4: Các ảnh kỷ niệm còn lại
            { src: "phuc_38.jpg", caption: "" }, { src: "phuc_39.jpg", caption: "" },
            { src: "phuc_40.jpg", caption: "" }, { src: "phuc_41.jpg", caption: "" },
            { src: "phuc_42.jpg", caption: "" }, { src: "phuc_43.jpg", caption: "" },
            
            { src: "phuc_45.jpg", caption: "" }  // Ảnh kết thúc
        ];

        const container = document.getElementById('slideshow');
        let currentSlideIndex = 0;
        let slideInterval;
        let isPaused = false;

        // Khởi tạo và tạo cấu trúc HTML cho các Slide ảnh
        function initSlideshow() {
            imageList.forEach((imgData, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;
                
                const img = document.createElement('img');
                img.src = imgData.src;
                img.alt = `Slide ${index + 1}`;
                // Xử lý lỗi nếu thiếu file ảnh trong thư mục để tránh màn hình trống
                img.onerror = function() {
                    this.style.display = 'none';
                    slideDiv.innerHTML = `<div style="color:rgba(255,255,255,0.3); font-size:1.5rem;">[Không tìm thấy file ${imgData.src}]</div>`;
                };
                
                slideDiv.appendChild(img);

                // Nếu bạn muốn chèn thêm chữ chạy ở dưới ảnh nào, chỉ cần điền vào phần 'caption' ở trên mảng danh sách
                if (imgData.caption) {
                    const captionDiv = document.createElement('div');
                    captionDiv.className = 'caption';
                    captionDiv.innerText = imgData.caption;
                    slideDiv.appendChild(captionDiv);
                }

                container.appendChild(slideDiv);
            });

            startInterval();
        }

        // Hàm điều khiển chuyển slide tiếp theo
        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            slides[currentSlideIndex].removeClass; // Xóa active cũ
            slides[currentSlideIndex].classList.remove('active');
            
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            
            slides[currentSlideIndex].classList.add('active');
        }

        function startInterval() {
            slideInterval = setInterval(nextSlide, DISPLAY_DURATION);
        }

        // Tính năng phụ: Bấm nút để Tạm dừng / Tiếp tục chạy nếu cần xem kỹ ảnh nào
        function togglePause() {
            const btn = document.getElementById('btnPause');
            if (isPaused) {
                startInterval();
                btn.innerText = "Tạm dừng";
                isPaused = false;
            } else {
                clearInterval(slideInterval);
                btn.innerText = "Tiếp tục chạy";
                isPaused = true;
            }
        }

        // Chạy trình chiếu khi trang đã tải xong
        window.onload = initSlideshow;
    </script>
</body>
</html>
